<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        .coins {
            font-size: 2.5rem;
            margin: 20px 0;
            color: #f1c40f;
            font-weight: bold;
        }
        .tap-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, #f39c12, #d35400);
            border: 5px solid #f1c40f;
            font-size: 3rem;
            color: white;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.4);
            transition: transform 0.1s;
            margin: 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tap-btn:active {
            transform: scale(0.95);
        }
        .energy-box {
            margin-top: 20px;
            font-size: 1.2rem;
        }
        .progress-bar {
            width: 80%;
            height: 15px;
            background-color: #333;
            border-radius: 10px;
            margin: 10px auto;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 100%;
            background-color: #2ecc71;
            transition: width 0.2s;
        }
    </style>
</head>
<body>

    <h2 id="user-name">مرحباً بك!</h2>
    <div class="coins">🪙 <span id="score">0</span></div>

    <div class="tap-btn" id="coin-btn">🐹</div>

    <div class="energy-box">
        ⚡ الطاقة: <span id="energy">100</span>/100
        <div class="progress-bar">
            <div class="progress-fill" id="energy-bar"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            if (tg.initDataUnsafe?.user) {
                document.getElementById('user-name').textContent = `مرحباً ${tg.initDataUnsafe.user.first_name}!`;
            }
        }

        let score = parseInt(localStorage.getItem('tap_score')) || 0;
        let energy = 100;
        const maxEnergy = 100;

        const scoreEl = document.getElementById('score');
        const energyEl = document.getElementById('energy');
        const energyBar = document.getElementById('energy-bar');
        const coinBtn = document.getElementById('coin-btn');

        scoreEl.textContent = score;

        coinBtn.addEventListener('click', () => {
            if (energy > 0) {
                score++;
                energy--;
                scoreEl.textContent = score;
                localStorage.setItem('tap_score', score);
                updateEnergyUI();
            }
        });

        // تجديد الطاقة تلقائياً كل ثانية
        setInterval(() => {
            if (energy < maxEnergy) {
                energy++;
                updateEnergyUI();
            }
        }, 1000);

        function updateEnergyUI() {
            energyEl.textContent = energy;
            const percentage = (energy / maxEnergy) * 100;
            energyBar.style.width = percentage + '%';
        }
    </script>
</body>
</html>
