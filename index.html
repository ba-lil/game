<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#160d2d">
  <meta name="description" content="Hexa Stack - Telegram Mini App">
  <title>Hexa Stack</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div>
        <div class="brand">HEXA <span>STACK</span></div>
        <div class="subtitle">Hex Puzzle</div>
      </div>
      <button id="soundBtn" class="icon-btn" aria-label="Toggle sound">🔊</button>
    </header>

    <section class="stats">
      <div class="stat"><span>Score</span><strong id="score">0</strong></div>
      <div class="stat"><span>Best</span><strong id="best">0</strong></div>
      <div class="stat"><span>Combo</span><strong id="combo">x0</strong></div>
    </section>

    <section class="game-card">
      <div id="board" class="board" aria-label="Hexagonal game board"></div>
      <div id="message" class="message hidden">
        <div class="message-box">
          <h2 id="messageTitle">Game Over</h2>
          <p id="messageText"></p>
          <button id="restartBtn" class="primary-btn">PLAY AGAIN</button>
        </div>
      </div>
    </section>

    <section class="tray-wrap">
      <div class="tray-title">DRAG A BLOCK TO THE BOARD</div>
      <div id="tray" class="tray"></div>
    </section>

    <footer>
      <button id="newGameBtn" class="secondary-btn">↻ New Game</button>
      <span>v0.1.0 • Telegram Mini App</span>
    </footer>
  </main>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
